<div class="page mx-auto max-w-6xl px-5 py-10 max-md:px-3">
	<header class="mb-8 flex flex-col gap-3">
		<h1 class="m-0 text-3xl font-semibold text-[var(--c-text-primary)]" translate>
			Нотаріуси
		</h1>
		<p class="m-0 max-w-2xl text-[var(--c-text-muted)]" translate>
			Каталог нотаріусів Legal — засвідчення документів і нотаріальні дії поруч із вами. Розділ ще наповнюється: профілі нотаріусів з'являться тут найближчим часом.
		</p>
	</header>

	<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
		@for (item of placeholders; track $index) {
			<p-card>
				<div class="flex flex-col items-center gap-3 py-6 text-center">
					<i class="pi pi-verified text-3xl text-[var(--c-text-muted)]"></i>
					<span class="text-sm text-[var(--c-text-muted)]" translate
						>Профіль нотаріуса скоро з'явиться</span
					>
				</div>
			</p-card>
		}
	</div>
</div>
